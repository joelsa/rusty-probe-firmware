[package]
authors = ["Emil Fresk <emil.fresk@gmail.com>"]
edition = "2021"
name = "rusty-probe"
version = "0.3.0"

[dependencies]
cortex-m = { version = "0.7.7" }
cortex-m-rt = { version = "0.7.5" }
defmt = { version = "1.0.1", features = ["encoding-rzcobs"] }
embedded-hal = { version = "1.0.0" }
embedded-io-async = { version = "0.7.0" }

embassy-executor = { version = "0.10.0", features = ["defmt"] }
embassy-futures = { version = "0.1.2" }
embassy-rp = { version = "0.10.0", features = ["rp2040", "defmt", "unstable-pac", "time-driver", "critical-section-impl", "executor-thread"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt"] }
embassy-usb = { version = "0.6.0", default-features = false, features = ["defmt", "max-interface-count-6", "max-handler-count-6"] }

panic-probe = { version = "1.0.0", features = ["print-defmt"] }
dap-rs = { version = "0.2.0", features = ["defmt"] }
git-version = "0.3.5"
portable-atomic = { version = "1", features = ["critical-section"] }

defmt-brtt = { version = "0.1.2", default-features = false }
# We don't need bbqueue directly, but we need to activate the
# thumbv6 feature on it so it will compile.
bbqueue = { version = "0.5", features = ["thumbv6"], optional = true }
static_cell = "2.1.1"

[features]
default = [ "defmt-brtt/rtt", "gnddetect" ]
defmt-bbq = ["defmt-brtt/bbq", "defmt-brtt/async-await", "dep:bbqueue"]
gnddetect = []
usb-serial-reboot = []

# cargo build/run
[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 's'
overflow-checks = true

# cargo build/run --release
[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false

# do not optimize proc-macro crates = faster builds from scratch
[profile.dev.build-override]
codegen-units = 8
debug = false
debug-assertions = false
opt-level = 0
overflow-checks = false

[profile.release.build-override]
codegen-units = 8
debug = false
debug-assertions = false
opt-level = 0
overflow-checks = false

# cargo test
[profile.test]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 3
overflow-checks = true

# cargo test --release
[profile.bench]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 3
